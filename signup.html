<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop DZ - Sign up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b1410;
            background-image: linear-gradient(135deg, rgba(14, 34, 23, 0.6) 0%, rgba(7, 15, 11, 0.9) 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
        }
        .signup-card {
            background: #0e1712; border: 1px solid #1b3624; border-radius: 20px;
            padding: 35px 30px; width: 100%; max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(35, 134, 54, 0.15);
            text-align: center;
        }
        .signup-card h2 { color: #4ee476; margin-bottom: 25px; font-size: 1.8rem; font-weight: 600; }
        
        /* تعديل الاتجاه وحقول الإدخال لتكون مضبوطة */
        .input-group { position: relative; margin-bottom: 15px; direction: ltr; }
        .input-group input {
            width: 100%; padding: 12px 45px 12px 15px; background: #132219;
            border: 1px solid #1f3d2a; color: #fff; border-radius: 12px; outline: none; font-size: 0.95rem; text-align: left; transition: 0.3s;
        }
        .input-group input::placeholder { color: #6e7681; }
        .input-group input:focus { border-color: #2ea043; box-shadow: 0 0 10px rgba(46, 160, 67, 0.3); }
        
        /* تثبيت الأيقونات في اليمين داخل الحقول */
        .input-group .input-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #6e7681; font-size: 0.95rem; }

        .btn-submit {
            width: 100%; padding: 13px; background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
            color: #fff; border: none; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4); transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .login-text { margin-top: 20px; font-size: 0.9rem; color: #8b949e; }
        .login-text a { color: #4ee476; text-decoration: none; font-weight: 500; margin: 0 3px; }
        .login-text a:hover { text-decoration: underline; }
        
        .error-msg { color: #f85149; font-size: 0.85rem; margin-bottom: 15px; display: none; text-align: right; }
    </style>
</head>
<body>

    <div class="signup-card">
        <h2>Sign up</h2>
        
        <div id="errorMsg" class="error-msg">الرجاء ملء جميع الحقول المطلوبة!</div>

        <div>
            <div class="input-group">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" id="fullname" placeholder="Full Name">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-envelope input-icon"></i>
                <input type="email" id="email" placeholder="Email Address">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-phone input-icon"></i>
                <input type="tel" id="phone" placeholder="Phone Number">
            </div>
            
            <div class="input-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="password" placeholder="Password">
            </div>

            <button type="button" id="signupBtn" class="btn-submit">Sign up</button>
        </div>

        <div class="login-text">
            لديك حساب بالفعل؟ <a href="login.html">Log in</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var signupBtn = document.getElementById('signupBtn');

            if (signupBtn) {
                signupBtn.addEventListener('click', function() {
                    var fullname = document.getElementById('fullname').value.trim();
                    var email = document.getElementById('email').value.trim();
                    var phone = document.getElementById('phone').value.trim();
                    var password = document.getElementById('password').value.trim();
                    var errorMsg = document.getElementById('errorMsg');

                    if (fullname === "" || email === "" || phone === "" || password === "") {
                        if (errorMsg) errorMsg.style.display = "block";
                        return;
                    }

                    // حفظ البيانات محلياً
                    localStorage.setItem('shop_dz_reg_email', email);
                    localStorage.setItem('shop_dz_reg_pass', password);
                    localStorage.setItem('shop_dz_fullname', fullname);

                    alert('تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.');
                    window.location.href = "login.html";
                });
            }
        });
    </script>
</body>
</html>
